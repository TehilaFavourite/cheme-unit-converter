name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo test --doc

  lint:
    name: Format, Clippy, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps

  msrv:
    name: Minimum supported Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --all-targets

  # The web interface. Its toolchain is pinned in .github/actions/setup-web;
  # the wasm crate is not part of the MSRV promise, which covers the library
  # and CLI (see docs/adr/0001-webassembly-over-server.md).
  web:
    name: Web interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web

      - name: Lint the binding crate
        run: cargo clippy --package cheme-unit-converter-wasm --all-targets -- -D warnings
      - name: Test the binding crate natively, including CLI parity
        run: cargo test --package cheme-unit-converter-wasm
      - name: Test the binding crate in WebAssembly (wasm-bindgen-test)
        run: cargo test --package cheme-unit-converter-wasm --target wasm32-unknown-unknown --test web
      - name: Build the WebAssembly module
        run: ./scripts/build-wasm.sh

      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Check formatting
        working-directory: web
        run: npm run format:check
      - name: Unit tests (Vitest)
        working-directory: web
        run: npm test

      - name: Build the site
        working-directory: web
        run: npm run build
      - name: Check the size budget
        run: |
          echo "### Web bundle size (gzip -9)" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/size-report.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (Playwright)
        working-directory: web
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
