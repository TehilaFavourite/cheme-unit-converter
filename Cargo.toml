[package]
name = "cheme-unit-converter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A unit-safe command-line converter for chemical engineering units"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TehilaFavourite/cheme-unit-converter"
keywords = ["chemical-engineering", "units", "conversion", "cli", "engineering"]
categories = ["command-line-utilities", "science"]

[dependencies]

[workspace]
members = ["wasm"]

# Size-optimised build for the WebAssembly module. A separate profile keeps
# the CLI's release build unchanged.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
